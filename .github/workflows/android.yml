name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK artifact for pull requests
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: momentum-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub release with APK
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
        APK_PATH: app/build/outputs/apk/debug/app-debug.apk
      run: |
        tag="build-${GITHUB_SHA::7}"
        if gh release view "$tag" >/dev/null 2>&1; then
          gh release upload "$tag" "$APK_PATH#momentum-debug.apk" --clobber
        else
          gh release create "$tag" "$APK_PATH#momentum-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "Momentum build ${GITHUB_SHA::7}" \
            --generate-notes \
            --latest=false
        fi
